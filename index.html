<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Macrolog</title>
  <meta name="description" content="A private calorie and macro tracker with barcode scanning.">
  <meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09111C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Macrolog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <nav id="tabs" aria-label="Main">
      <button type="button" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Today</span></button>
      <button type="button" data-tab="foods"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Foods</span></button>
      <button type="button" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 15l4-5 4 3 6-8"/></svg><span>Progress</span></button>
      <button type="button" data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg><span>Profile</span></button>
    </nav>
  </div>
  <div id="layers"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:16px">Macrolog needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
